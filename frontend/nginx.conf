server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Appels API redirigés vers le back-end Spring Boot
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_read_timeout 300s;   # l'import Hub'Eau peut prendre du temps
    }

    # Routage Angular : toute URL inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
