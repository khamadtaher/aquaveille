services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aquaveille
      POSTGRES_USER: aquaveille
      POSTGRES_PASSWORD: aquaveille
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquaveille -d aquaveille"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/aquaveille
      DB_USER: aquaveille
      DB_PASSWORD: aquaveille
      AQUAVEILLE_DEPARTEMENTS: "91"
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres-data:
