services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: aquaveille
      MYSQL_USER: aquaveille
      MYSQL_PASSWORD: aquaveille
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/aquaveille?serverTimezone=Europe/Paris
      DB_USER: aquaveille
      DB_PASSWORD: aquaveille
      AQUAVEILLE_DEPARTEMENTS: "91"
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql-data:
